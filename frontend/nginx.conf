server {
    listen 80;
    server_name _;

    # Every app ever served from localhost shares one cookie jar, so a dev browser
    # routinely sends headers far beyond nginx's 8k default and gets a bare 400.
    client_header_buffer_size 16k;
    large_client_header_buffers 8 32k;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
