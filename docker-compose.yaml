services:
  postgres:
    image: postgres:latest
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: ticketingmaster
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ticketingmaster"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./backend
    container_name: migrate
    command: ["/app/migrate", "up"]
    environment:
      JWT_SECRET: local-dev-secret
      POSTGRESQL_URL: postgres://postgres:secretpassword@postgres:5432/ticketingmaster
      REDIS_URL: redis:6379
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  seed:
    build:
      context: ./backend
    container_name: seed
    command: ["/app/seeder"]
    environment:
      JWT_SECRET: local-dev-secret
      POSTGRESQL_URL: postgres://postgres:secretpassword@postgres:5432/ticketingmaster
      REDIS_URL: redis:6379
    depends_on:
      migrate:
        condition: service_completed_successfully

  backend:
    build:
      context: ./backend
    container_name: backend
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      JWT_SECRET: local-dev-secret
      POSTGRESQL_URL: postgres://postgres:secretpassword@postgres:5432/ticketingmaster
      REDIS_URL: redis:6379
      DEMO_MODE: "true"
      MAX_CONCURRENT_QUEUE: 10
      WHITELIST_TTL: 45s
      HEARTBEAT_TTL: 30s
      QUEUE_TTL: 5m
      PROMOTE_INTERVAL: 1s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Resolved by the browser on the host, so it points at the published
        # backend port rather than the compose service name.
        VITE_API_BASE: http://localhost:8000
    container_name: frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
    driver: local
