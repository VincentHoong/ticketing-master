version: '3.9'
services:
  postgres:
    image: postgres:latest
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: ticketingmaster
    volumes:
      - postgres_data:/var/lib/postgresql
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "YourSecurePassword", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
volumes:
  postgres_data:
  redis_data:
    driver : local